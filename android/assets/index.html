  html,body { width:100%;height:100%;margin:0;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none; }

  /* The whole UI is drawn on a fixed 1280x576 stage and scaled to fit the screen. */
  #stage { position:absolute;left:50%;top:50%;width:1280px;height:576px;transform-origin:0 0;overflow:hidden;
    background:radial-gradient(ellipse 60% 70% at 50% 50%,#0b0507 0%,#050304 55%,#010101 100%); }
  #frame { position:absolute;inset:0;width:100%;height:100%;pointer-events:none; }
  #frame path { fill:none;stroke-linecap:round; }

  .round-btn { position:absolute;top:19px;width:70px;height:70px;border-radius:50%;border:1.5px solid #26272b;
    background:#0b0c0e;display:grid;place-items:center;color:#fff;padding:0;cursor:pointer; }
  .round-btn:active { border-color:var(--accent); }
  .round-btn svg { width:30px;height:30px;fill:currentColor; }
  #settingsBtn { left:74px; } #menuButton { right:74px; }

  #status { position:absolute;left:555px;top:21px;width:171px;height:44px;border-radius:22px;border:1.5px solid #25262a;

  #status i { width:17px;height:17px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px 2px rgba(var(--accent-rgb),.55); }
  #status.offline i { background:#5c5e64;box-shadow:none; } #status.offline { color:#9a9ca2; }

  /* Joysticks */
  .stick { position:absolute;top:146px;width:270px;height:270px;border-radius:50%;touch-action:none;cursor:grab; }
  #throttleStick { left:101px; } #steeringStick { left:911px; }
  .stick .base { position:absolute;inset:0;border-radius:50%;border:2px solid #1d1e21;
    background:radial-gradient(circle,#020203 0 52%,#050506 53% 100%);box-shadow:inset 0 0 0 1px #000,0 0 40px 6px #000; }
  .stick .base:after { content:"";position:absolute;inset:14%;border-radius:50%;border:1px solid #121316; }
  .stick .arc,.stick .glow { position:absolute;inset:-3px;border-radius:50%;
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4.5px) calc(100% - 1px),transparent 100%);
            mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4.5px) calc(100% - 1px),transparent 100%); }
  .stick .glow { filter:blur(7px);opacity:.75;inset:-6px; }
  .stick .knob { position:absolute;z-index:2;left:50%;top:50%;width:90px;height:90px;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 50% 28%,#e9e9eb 0%,#c9c9cd 45%,#b1b1b6 100%);
    box-shadow:0 0 0 1px #0006,0 6px 14px #000a,0 0 24px rgba(255,255,255,.08); transition:left .07s linear,top .07s linear; }
  .stick.active .knob { transition:none; }

  /* Gauge */
  #gauge { position:absolute;left:470px;top:112px;width:340px;height:340px; }
  #gauge svg { position:absolute;inset:0;width:100%;height:100%;overflow:visible; }
  #outerRing,#outerGlow { position:absolute;left:0;top:0;width:340px;height:340px;border-radius:50%;
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 11px),#000 calc(100% - 10px) calc(100% - 7px),transparent calc(100% - 6px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 11px),#000 calc(100% - 10px) calc(100% - 7px),transparent calc(100% - 6px)); }
  #outerGlow { filter:blur(9px); }
  #gauge .readout { position:absolute;left:0;right:0;top:0;height:340px;text-align:center;pointer-events:none; }
  #gauge .t { position:absolute;left:0;right:0;top:99px;font-size:17px;font-weight:500;letter-spacing:.34em;text-indent:.34em;color:#b8b9be; }
  #speedValue { position:absolute;left:0;right:0;top:118px;height:100px;font:italic 900 98px/100px "Exo2Digits","Exo 2","Eurostile",system-ui,sans-serif;
    letter-spacing:-.02em;color:#fff;text-shadow:0 0 18px rgba(255,255,255,.18); }
  #gauge .u { position:absolute;left:0;right:0;top:222px;font-size:22px;font-weight:500;color:#8c8d92; }
  #speedMark { position:absolute;left:115px;top:279px;width:110px;height:17px; }
  #speedMark i { position:absolute;top:0;height:17px;width:19px;transform:skewX(-30deg);background:var(--accent);filter:drop-shadow(0 0 4px var(--accent)); }

<body>

    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>

  <div id="status"><i></i><span id="statusText">Connected</span></div>

<script>
(() => {
  const DEAD_ZONE = 0.06, SEND_INTERVAL_MS = 60, MAX_STICK_TRAVEL = 0.30;
  const SEGS = 20, SIDE_SPAN = 130;       // 20 segments per side, 0 at the top, +-130deg
  let BASE_URL = "", throttle = 0, steering = 0, speed = 0;
  let lastSent = "", lastSendAt = 0, requestBusy = false;
  try { if (window.Android && window.Android.getBaseUrl) BASE_URL = window.Android.getBaseUrl() || ""; } catch (_) {}

  const $ = id => document.getElementById(id);
  const stage = $("stage"), status = $("status"), statusText = $("statusText"), speedValue = $("speedValue");
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- fit the 1280x576 stage to any screen ---------- */
  function fit() {
    const s = Math.min(innerWidth / 1280, innerHeight / 576);
    stage.style.transform = `scale(${s}) translate(-50%,-50%)`;
  }
  addEventListener("resize", fit); fit();

  /* ---------- colour: green (0) -> amber -> reddish-orange (+-100) ---------- */
  const STOPS = [[0,[25,230,90]],[.38,[190,225,40]],[.6,[255,170,25]],[.8,[255,105,25]],[1,[255,40,22]]];
  function colorAt(t) {
    t = clamp(t, 0, 1);
    for (let i = 1; i < STOPS.length; i++) if (t <= STOPS[i][0]) {
      const [t0, c0] = STOPS[i-1], [t1, c1] = STOPS[i], k = (t - t0) / (t1 - t0);
      return c0.map((v, j) => Math.round(v + (c1[j] - v) * k));
    }
    return STOPS[STOPS.length-1][1];
  }
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  /* ---------- gauge segments (SVG, built once) ---------- */
  const NS = "http://www.w3.org/2000/svg", R_OUT = 140, R_IN = 111;
  const pt = (r, deg) => [r * Math.sin(deg * Math.PI / 180), -r * Math.cos(deg * Math.PI / 180)];
  function segPath(a0, a1) {
    const p = (r, a) => pt(r, a).map(n => n.toFixed(2)).join(" ");
    return `M${p(R_IN,a0)} L${p(R_OUT,a0)} A${R_OUT} ${R_OUT} 0 0 ${a1>a0?1:0} ${p(R_OUT,a1)} L${p(R_IN,a1)} A${R_IN} ${R_IN} 0 0 ${a1>a0?0:1} ${p(R_IN,a0)}Z`;
  }
  const segEls = [];   // {el, frac, dir}
  const segSvg = $("segs");
  segSvg.innerHTML = `<defs><radialGradient id="fade" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="${R_OUT}"><stop offset="${(R_IN/R_OUT).toFixed(3)}" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff"/></radialGradient><mask id="fadeMask"><rect x="-170" y="-170" width="340" height="340" fill="url(#fade)"/></mask></defs>`;
  const g = document.createElementNS(NS, "g"); g.setAttribute("mask", "url(#fadeMask)"); segSvg.appendChild(g);
  for (const dir of [1, -1]) for (let i = 0; i < SEGS; i++) {
    const w = SIDE_SPAN / SEGS, a0 = dir * (1.1 + i * w), a1 = dir * ((i + 1) * w - .6);
    const el = document.createElementNS(NS, "path"); el.setAttribute("d", segPath(a0, a1)); g.appendChild(el);
    segEls.push({ el, i, dir });
  }
  const bars = $("speedMark");
  for (let i = 0; i < 4; i++) { const b = document.createElement("i"); b.style.left = (i * 24) + "px"; bars.appendChild(b); }

  /* ---------- arcs on the joystick rings & the gauge outer ring ---------- */
  // [start, peak-start, peak-end, end] in degrees clockwise from top
  const STICK_ARCS = { throttleStick: [[18,35,75,104],[158,190,235,262]], steeringStick: [[104,138,172,204],[262,282,330,352]] };
  function conic(arcs, c, boost, base) {
    const stops = [];
    for (let d = 0; d <= 360; d += 5) {
      let a = 0;
      for (const [s, p0, p1, e] of arcs) {
        if (d > s && d < e) a = Math.max(a, d < p0 ? (d - s) / (p0 - s) : d > p1 ? (e - d) / (e - p1) : 1);
      }
      stops.push(`${rgba(c, Math.min(1, a * boost + (base || 0)))} ${d}deg`);
    }
    return `conic-gradient(${stops.join(",")})`;
  }
  const stickArcEls = ["throttleStick", "steeringStick"].map(id => $(id));

  function renderTheme() {
    const t = Math.abs(speed) / 100, c = colorAt(t);
    stage.style.setProperty("--accent", `rgb(${c})`);
    stage.style.setProperty("--accent-rgb", c.join(","));
    document.documentElement.style.setProperty("--accent", `rgb(${c})`);
    document.documentElement.style.setProperty("--accent-rgb", c.join(","));
    // gauge segments: colour by distance from zero, lit from the centre outward
    for (const { el, i, dir } of segEls) {
      const sc = colorAt((i + .5) / SEGS), lit = (Math.sign(speed) === dir || (speed === 0 && false)) ? clamp(Math.abs(speed) / 100 * SEGS - i, 0, 1) : 0;
      el.setAttribute("fill", `rgb(${sc})`); el.setAttribute("fill-opacity", (.13 + .87 * lit).toFixed(3));
    }
    // outer ring: faint everywhere, hot spot rides at the current angle
    const ang = speed / 100 * SIDE_SPAN, mid = ((ang % 360) + 360) % 360;
    const lo = ((mid - 70) + 360) % 360, hi = (mid + 70) % 360;
    const peak = [[lo - 0, mid - 18, mid + 18, lo + 140]];
    const arcs = []; for (const k of [-360, 0, 360]) arcs.push([lo + k, mid - 18 + k, mid + 18 + k, lo + 140 + k]);
    const spanArcs = []; for (const k of [0, 360]) spanArcs.push([-134 + k, -120 + k, 120 + k, 134 + k]);
    const faint = conic(spanArcs, c, .32), hot = conic(arcs, [Math.min(255, c[0] + 40), Math.min(255, c[1] + 60), Math.min(255, c[2] + 60)], .35 + .65 * t + .25);
    $("outerRing").style.background = `${hot},${faint}`;
    $("outerGlow").style.background = `${hot}`;
    $("outerGlow").style.opacity = (.55 + .45 * t).toFixed(2);
    stickArcEls.forEach(st => {
      const arcsDef = STICK_ARCS[st.id], boost = .9;
      const bg = conic(arcsDef, c, boost);
      st.querySelector(".arc").style.background = bg; st.querySelector(".glow").style.background = bg;
    });
    // text
    speedValue.textContent = String(speed);
    speedValue.style.textShadow = `0 0 ${14 + 16 * t}px rgba(${c.join(",")},${.15 + .35 * t})`;
  }

  function setConnection(ok) { status.classList.toggle("offline", !ok); statusText.textContent = ok ? "Connected" : "Offline"; }
  const controlUrl = (l, r) => `${BASE_URL}/control?left=${l}&right=${r}`;

  function compute() {
    const t = Math.abs(throttle) < DEAD_ZONE ? 0 : throttle;
    const s = Math.abs(steering) < DEAD_ZONE ? 0 : steering;
    const l = Math.round(clamp(t + s, -1, 1) * 100), r = Math.round(clamp(t - s, -1, 1) * 100);
    return { l, r };
  }
  let lastShown = null;
  function updateDrive(force = false) {
    const { l, r } = compute();
    // speed shown is the forward/reverse speed of the robot: -100 (full reverse) .. +100 (full forward)
    speed = clamp(Math.round((l + r) / 2), -100, 100);
    if (speed !== lastShown) { lastShown = speed; renderTheme(); }
    if (!BASE_URL) { setConnection(false); return; }
    const command = `${l},${r}`, now = Date.now();
    if (!force && (command === lastSent || now - lastSendAt < SEND_INTERVAL_MS)) return;
    if (requestBusy) return;
    requestBusy = true; lastSent = command; lastSendAt = now;
    fetch(controlUrl(l, r), { method: "GET", cache: "no-store" })
      .then(res => { if (!res.ok) throw new Error("HTTP " + res.status); setConnection(true); })
      .catch(() => setConnection(false)).finally(() => { requestBusy = false; });
  }

  function attachStick(stickId, knobId, axis) {
    const stick = $(stickId), knob = $(knobId); let pointerId = null;
    function move(e) {
      if (pointerId !== e.pointerId) return;
      const rect = stick.getBoundingClientRect(), cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2, limit = rect.width * MAX_STICK_TRAVEL;
      let dx = e.clientX - cx, dy = e.clientY - cy;
      if (axis === "y") dx = 0; else dy = 0;
      const d = Math.hypot(dx, dy); if (d > limit) { dx *= limit / d; dy *= limit / d; }
      knob.style.left = `${50 + dx / rect.width * 100}%`; knob.style.top = `${50 + dy / rect.height * 100}%`;
      if (axis === "y") throttle = clamp(-dy / limit, -1, 1); else steering = clamp(dx / limit, -1, 1);
      updateDrive();
    }
    function release(e) {
      if (pointerId !== e.pointerId) return; pointerId = null; stick.classList.remove("active");
      try { stick.releasePointerCapture(e.pointerId); } catch (_) {}
      knob.style.left = "50%"; knob.style.top = "50%";
      if (axis === "y") throttle = 0; else steering = 0; updateDrive(true);
    }
    stick.addEventListener("pointerdown", e => { if (pointerId !== null) return; pointerId = e.pointerId; stick.classList.add("active"); stick.setPointerCapture(pointerId); move(e); });
    stick.addEventListener("pointermove", move); stick.addEventListener("pointerup", release);
    stick.addEventListener("pointercancel", release); stick.addEventListener("lostpointercapture", release);
  }
  attachStick("throttleStick", "throttleKnob", "y"); attachStick("steeringStick", "steeringKnob", "x");

  window.__getRobotBase = () => BASE_URL;
  window.__setRobotBase = url => { BASE_URL = url || ""; try { if (window.Android && window.Android.saveBaseUrl) window.Android.saveBaseUrl(BASE_URL); } catch (_) {} lastSent = ""; updateDrive(true); };
  window.__stopDrive = () => { throttle = 0; steering = 0; updateDrive(true); };
  $("menuButton").addEventListener("click", () => { try { if (window.Android && window.Android.editBaseUrl) window.Android.editBaseUrl(); } catch (_) {} });
  document.addEventListener("visibilitychange", () => { if (document.hidden) { throttle = 0; steering = 0; updateDrive(true); } });

  renderTheme();
  if (!BASE_URL && window.Android && window.Android.editBaseUrl) window.Android.editBaseUrl();
  else if (BASE_URL) fetch(controlUrl(0, 0), { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(); setConnection(true); }).catch(() => setConnection(false));
  else setConnection(false);
  window.__setSpeedPreview = v => { speed = clamp(Math.round(v), -100, 100); lastShown = speed; renderTheme(); };  // visual testing hook
})();
</script>
</body>
</html>
